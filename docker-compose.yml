services:
  # --- Databases ---
  postgres:
    image: postgres:15-alpine
    container_name: uct_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: uct_map_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - uct_network

  mongodb:
    image: mongo:6-jammy
    container_name: uct_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - uct_network

  # --- Microservices ---
  # The team will add their Dockerfile builds here as they progress
  # Example:
  identity-api:
    build:
      context: .
      dockerfile: src/Services/Identity/Dockerfile
    container_name: uct_identity_api
    ports:
      - "${IDENTITY_PORT:-5001}:8080"
    environment:
      ConnectionStrings__IdentityDb: Host=postgres;Port=5432;Database=uct_map_db;Username=root;Password=rootpassword
      JwtConfig__Key: ${JWT_KEY:-replace-with-a-long-development-secret}
      JwtConfig__Issuer: ${JWT_ISSUER:-https://identity-api}
      JwtConfig__Audience: ${JWT_AUDIENCE:-api-gateway}
      JwtConfig__TokenValidationMins: ${JWT_TOKEN_VALIDATION_MINS:-30}
    depends_on:
      - postgres
    networks:
      - uct_network

networks:
  uct_network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
