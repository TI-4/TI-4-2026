services:
  # --- Databases ---
  postgres:
    image: postgres:15-alpine
    container_name: uct_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: uct_map_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - uct_network

  mongodb:
    image: mongo:6-jammy
    container_name: uct_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - uct_network

  # --- Microservices ---
  # The team will add their Dockerfile builds here as they progress
  # Example:
  identity-api:
    image: ${IDENTITY_IMAGE:-uct-map-identity:local}
    ports:
      - "${IDENTITY_PORT:-5001}:80"
    environment:
      ConnectionStrings__IdentityDb: ${IDENTITY_DB_CONNECTION_STRING}
      JwtConfig__Key: ${JWT_KEY}
      JwtConfig__Issuer: ${JWT_ISSUER}
      JwtConfig__Audience: ${JWT_AUDIENCE}
      JwtConfig__TokenValidationMins: ${JWT_TOKEN_VALIDATION_MINS:-30}
    depends_on:
      identity-db:
        condition: service_healthy
    networks:
      - uct_network

  identity-db:
    image: postgres:16-alpine
    container_name: uct_identity_db
    environment:
      POSTGRES_DB: ${IDENTITY_POSTGRES_DB:-identity_db}
      POSTGRES_USER: ${IDENTITY_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${IDENTITY_POSTGRES_PASSWORD:?IDENTITY_POSTGRES_PASSWORD must be set}
    ports:
      - "${IDENTITY_DB_PORT:-5431}:5432"
    volumes:
      - identity_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${IDENTITY_POSTGRES_USER:-postgres} -d $${IDENTITY_POSTGRES_DB:-identity_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - uct_network

networks:
  uct_network:
    driver: bridge

volumes:
  identity_db_data:
  postgres_data:
  mongodb_data:
