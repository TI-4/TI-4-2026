version: '3.8'

services:
  # --- Databases ---
  postgres:
    image: postgres:15-alpine
    container_name: uct_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: uct_map_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - uct_network

  mongodb:
    image: mongo:6-jammy
    container_name: uct_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - uct_network

  # --- Microservices ---
  
  # ---- Identity ---- #
  identity-api:
    build:
      context: .
      dockerfile: src/Services/Identity/Dockerfile
    container_name: uct_identity_api
    ports:
      - "5001:80"
    environment:
      ConnectionStrings__IdentityDb: Host=postgres;Port=5432;Database=uct_identity_db;Username=root;Password=rootpassword
      JwtConfig__Key: 7d82f3a9b4e1c60d5f27a8b9c0d1e2f3a4b5c6d7e8f90a1b2c3d4e5f6a7b8c9d
      JwtConfig__Issuer: https://identity-api
      JwtConfig__Audience: api-gateway
      JwtConfig__TokenValidationMins: 30
    depends_on:
      - postgres
    networks:
      - uct_network

  # ---- Campus ---- #
  campus-api:
    build:
      context: .
      dockerfile: src/Services/Campus/Dockerfile
    container_name: uct_campus_api
    ports:
      - "5002:80"
    environment:
      ConnectionStrings__CampusDb: Host=postgres;Port=5432;Database=uct_campus_db;Username=root;Password=rootpassword
    depends_on:
      - postgres
    networks:
      - uct_network
      
  # ---- Schedule ---- #
  schedule-api:
    build:
      context: .
      dockerfile: src/Services/Schedule/Dockerfile
    container_name: uct_schedule_api
    ports:
      - "5004:80"
    environment:
      ConnectionStrings__ScheduleDb: Host=postgres;Port=5432;Database=uct_schedule_db;Username=root;Password=rootpassword
    depends_on:
      - postgres
    networks:
      - uct_network

networks:
  uct_network:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
